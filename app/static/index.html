<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>逸问问答助手</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css?v=20260712-cleanup" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">逸</div>
          <div>
            <h1>逸问问答助手</h1>
            <p>&#20844;&#20849;&#38382;&#31572;&#21644;&#31169;&#20154;&#20107;&#21153;&#37117;&#20351;&#29992;&#24403;&#21069;&#29992;&#25143;&#30340;&#20010;&#20154;&#30331;&#24405;&#24577;&#12290;</p>
          </div>
        </div>
        <section class="identity-panel">
          <label for="user-id">本机会话</label>
          <div class="identity-row">
            <input id="user-id" value="正在创建..." readonly autocomplete="off" />
            <button id="login-button" type="button">重建会话</button>
          </div>
          <p id="identity-status">&#26412;&#26426;&#20250;&#35805;&#29992;&#20110;&#38548;&#31163;&#24403;&#21069;&#27983;&#35272;&#22120;&#65307;&#20844;&#20849;&#38382;&#31572;&#21644;&#31169;&#20154;&#20107;&#21153;&#37117;&#20351;&#29992;&#24403;&#21069;&#29992;&#25143;&#30340;&#20010;&#20154;&#30331;&#24405;&#24577;&#12290;</p>
        </section>
        <section class="mode-panel">
          <h2>服务状态</h2>
          <div class="capability ok">
            <span>公共问答</span>
            <strong id="public-status">检测中</strong>
          </div>
          <div class="private-auth-actions public-auth-actions">
            <button id="public-login-button" type="button">授权官方逸问</button>
          </div>
          <p id="public-auth-status">点击后在独立浏览器窗口完成官方授权，助手会自动读取登录结果。</p>
          <div class="capability pending">
            <span>私人事务</span>
            <strong id="private-status">需要个人登录</strong>
          </div>
          <div class="private-auth-actions">
            <button id="private-login-button" type="button">&#20225;&#19994;&#24494;&#20449;&#25195;&#30721;&#32465;&#23450;</button>
            <button id="private-refresh-button" type="button" class="ghost-button">&#21047;&#26032;&#25945;&#21153;&#20250;&#35805;</button>
          </div>
          <div class="private-auth-panel" id="private-auth-panel" hidden>
            <img id="private-qr" alt="企业微信登录二维码" />
            <p id="private-auth-status">等待生成二维码。</p>
          </div>
        </section>
        <section class="history-panel">
          <div class="history-heading">
            <h2>&#21382;&#21490;&#23545;&#35805;</h2>
            <button id="history-refresh-button" type="button" class="ghost-button">&#21047;&#26032;</button>
          </div>
          <div id="history-list" class="history-list">&#30331;&#24405;&#21518;&#26174;&#31034;&#24403;&#21069;&#36134;&#21495;&#21382;&#21490;&#12290;</div>
        </section>
      </aside>

      <section class="chat-shell">
        <header class="chat-header">
          <div>
            <h2 id="channel-title">校内知识库</h2>
            <p id="channel-desc">使用逸问官方“校内知识库”范围回答。</p>
          </div>
          <button id="clear-button" type="button" class="ghost-button">清空</button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <textarea id="message" rows="3" placeholder="输入问题，例如：请简单介绍一下图书馆预约规则"></textarea>
          <div class="composer-actions">
            <div class="composer-left">
              <div class="channel-picker" id="channel-picker">
                <button class="channel-toggle" id="channel-toggle" type="button" aria-haspopup="menu" aria-expanded="false">
                  <span class="channel-label">栏目</span>
                  <span id="channel-current">校内知识库</span>
                  <span class="channel-caret">▾</span>
                </button>
                <div class="channel-menu" id="channel-menu" role="menu" aria-label="选择问答栏目">
                  <button class="channel-option active" type="button" role="menuitem" data-channel="sysu_kb">校内知识库</button>
                  <button class="channel-option" type="button" role="menuitem" data-channel="sysu_news">校内资讯</button>
                  <button class="channel-option" type="button" role="menuitem" data-channel="web_search">联网搜索</button>
                  <button class="channel-option" type="button" role="menuitem" data-channel="model">模型问答</button>
                  <button class="channel-option" type="button" role="menuitem" data-channel="freshman_materials">中大真题资料查询</button>
                  <button class="channel-option" type="button" role="menuitem" data-channel="private">私人事务</button>
                </div>
              </div>
            </div>
            <div class="hint" id="composer-hint">当前栏目：校内知识库。私人预约、审批、课表、成绩请切换到“私人事务”。</div>
            <button id="send-button" type="submit">发送</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/static/app.js?v=20260726-local-auth"></script>
  </body>
</html>
